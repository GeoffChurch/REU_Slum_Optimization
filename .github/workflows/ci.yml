name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # Fail if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - run: make lint
      - run: make typecheck
      - run: make test
