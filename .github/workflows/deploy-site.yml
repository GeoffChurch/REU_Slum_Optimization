# Build the MkDocs site and deploy it to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
# CI regenerates the data-driven pages (scripts/gen_site_pages.py, stdlib-only) from examples/ and
# the tracked outputs/ eval snapshot (see .gitignore), then builds -- so pushing new run artifacts
# is the only manual step; generated pages and docs/assets are not committed.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "outputs/**"
      - "scripts/gen_site_pages.py"
      - "mkdocs.yml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9,<10"
      - run: python3 scripts/gen_site_pages.py
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
