# Build the MkDocs site and deploy it to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
# CI regenerates the data-driven pages (scripts/gen_site_pages.py, stdlib-only) from examples/ and
# the tracked outputs/ eval snapshot (see .gitignore), then builds -- so pushing new run artifacts
# is the only manual step; generated pages and docs/assets are not committed.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "outputs/**"
      - "web/**"
      - "scripts/gen_site_pages.py"
      # The wheel this job builds is packaged FROM src/reblock and shipped to readers, and
      # pyproject.toml declares the name and version the DRAWROAD producer constructs its filename
      # from -- so a solver change or a version bump with no other edit must still redeploy, or
      # the site keeps serving the previous solver with nothing to show it is stale.
      - "src/reblock/**"
      - "pyproject.toml"
      - "mkdocs.yml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned exactly, not ranged: this job renders the published site, so a silent minor bump
      # in either package can change theme markup or image handling under us with no commit to
      # point at. Bump these deliberately.
      - run: pip install mkdocs-material==9.7.7 mkdocs-glightbox==0.5.2
      # The widget bundle. Node is pinned to the same major as the `nodejs-wheel` in
      # pyproject.toml's dev group, so the tsc that gates pull requests and the esbuild that ships
      # are the same runtime. `npm ci` (not install) so package-lock.json is authoritative.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # The reblock wheel `micropip` installs into the DrawRoad widget's Pyodide runtime
      # (data-wheel, copied into docs/assets/wheels/ by gen_site_pages.py's DRAWROAD producer).
      # `dist/` is gitignored and gen_site_pages.py raises if no wheel is there, so this must run
      # before it.
      #
      # `make wheel` is `uv build --wheel`, which installs only the build backend (hatchling,
      # pinned in pyproject.toml's [tool.uv]), never the project's environment, so this job still
      # has no science stack -- which is also why `scripts/gen_site_pages.py` is stdlib-only and
      # runs under plain `python3`. The wheel declares no `Requires-Dist`
      # (tests/test_wheel_metadata.py), which is what keeps micropip from trying to resolve the
      # scientific stack from PyPI, where no wasm wheel exists.
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build the reblock wheel for Pyodide
        run: make wheel
      - run: python3 scripts/gen_site_pages.py
      # --strict promotes MkDocs' broken-link warnings to build failures (an orphan page -- one
      # outside nav -- only logs at INFO and does NOT fail the build even under --strict, verified
      # empirically). The site's nav is explicit and its cross-page links are hand-written, so a
      # moved page otherwise ships a dead link silently.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
