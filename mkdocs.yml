# Project site (GitHub Pages; deployed by .github/workflows/deploy-site.yml, which regenerates
# the data-driven pages in CI -- docs/methods/, docs/benchmark.md, and docs/assets/ are NOT
# committed). For a local preview:
#   python3 scripts/gen_site_pages.py   # regenerate data-driven pages from run artifacts
#   mkdocs serve                        # needs mkdocs-material (e.g. `pixi exec --spec mkdocs-material mkdocs serve`)
site_name: reblock · REU Slum Optimization
site_description: >-
  Generating and evaluating road-network proposals for informal urban settlements —
  a Stony Brook University REU project.
site_url: https://jmendoza167.github.io/REU_Slum_Optimization/
repo_url: https://github.com/jmendoza167/REU_Slum_Optimization
repo_name: jmendoza167/REU_Slum_Optimization

# Internal working notes stay out of the published site (the files themselves are untouched);
# _intro.md is the handwritten partial the generator folds into index.md, not a page of its own.
exclude_docs: |
  superpowers/
  _intro.md

theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.top
    - navigation.footer
    - toc.integrate      # single-page site: the sidebar IS the anchor table of contents
    - toc.follow
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/sbu.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Metrics — North Star: metrics-north-star.md
