# Project site (GitHub Pages; deployed by .github/workflows/deploy-site.yml, which regenerates
# the data-driven pages in CI -- docs/methodology/, docs/results/, and docs/assets/ are NOT
# committed). CI's actual check is `mkdocs build --strict`, which fails the build on a broken
# link instead of just warning (an orphan page -- one outside nav -- only logs at INFO and does
# NOT fail the build, verified). For a local preview:
#   python3 scripts/gen_site_pages.py   # regenerate data-driven pages from run artifacts
#   mkdocs serve                        # needs mkdocs-material (e.g. `pixi exec --spec mkdocs-material mkdocs serve`)
site_name: reblock · REU Slum Optimization
site_description: >-
  Generating and evaluating road-network proposals for informal urban settlements —
  a Stony Brook University REU project.
site_url: https://jmendoza167.github.io/REU_Slum_Optimization/
copyright: Stony Brook University REU · AI Innovation &amp; Diffusion
repo_url: https://github.com/jmendoza167/REU_Slum_Optimization
repo_name: jmendoza167/REU_Slum_Optimization

# Internal working notes stay out of the published site (the files themselves are untouched);
# _partials/ holds the handwritten prose the generator folds artifacts into -- one directory
# exclusion here, rather than a per-file list, so it does not go stale as more partials are added;
# metrics-north-star.md is internal design-direction writing that links into superpowers/, so it
# ships with those notes rather than as a public page.
exclude_docs: |
  superpowers/
  _partials/
  metrics-north-star.md
  stylesheets/fonts/README.md
  # dream_come_true is UNPUBLISHED, not removed. The method stays in the pipeline
  # (conf/compare_config.yaml, conf/method/, src/) and the generator still writes this page from
  # its METHODS registry entry -- it is simply not built into the site, because the method has no
  # run artifacts yet and carries no numbers.
  #
  # STALE-KEY WARNING: this path is the method's slug. If the method is renamed upstream, this
  # line silently stops matching and the renamed page REAPPEARS in the built site -- reachable by
  # direct URL and, because the nav below is explicit, linked from nowhere. There is no build
  # warning to catch it: an orphan page (one outside nav) logs at INFO under `mkdocs build
  # --strict`, not WARNING, and the build exits 0 regardless (verified empirically). Whoever
  # renames the method must update this line and the nav together.
  #
  # tests/test_gen_site_pages.py::test_unpublished_methods_are_excluded_from_the_build guards the
  # published=False/exclude_docs pairing: it asserts this excluded path equals the generator's
  # actual output path for the slug, derived from gen_site_pages.py's own methodology_dir/
  # methods_dir assignments -- so a slug rename AND a wrong-but-plausible path (e.g. a pre-renest
  # `methods/<slug>.md`) both fail CI, not only a missing slug.
  methodology/methods/dream_come_true.md

theme:
  name: material
  custom_dir: overrides   # only partials/copyright.html, which adds the REU affiliation line
  favicon: brand/favicon.png
  # The HORIZONTAL lockup (1184x200) -- the vertical one is near-square and turns to mush at the
  # ~21px the header allows. The mark is 2-colour with no reversed variant and must not be
  # recoloured, and this file is 78% transparent, so its #990000 shield and "University" would
  # sit straight on the red header bar and vanish. stylesheets/sbu.css therefore gives
  # .md-header__button.md-logo a white plate with clear space, and sizes the mark by height.
  logo: brand/sbu-logo-horz.png
  palette:
    # Light is the default because the use scene is a daytime read of dense figures on a laptop;
    # dark is offered, not assumed. Both schemes are hand-coloured in stylesheets/sbu.css.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - navigation.indexes  # a section's index.md is the section's own landing page (Methods)
    - toc.follow          # multi-page site: real page nav on the left, each page's TOC on the right
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/fonts.css   # self-hosted faces; must load before the sheet that uses them
  - stylesheets/sbu.css

plugins:
  - search
  # Click-to-zoom for the run renders and frontier curves, which carry detail that does not
  # survive being scaled into the page. `skip_class` opts out the marks and the hero figure --
  # brand assets and decoration are not data, so they are not zoom targets.
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: none
      width: auto
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
        - skip-lightbox
      auto_caption: false
      caption_position: bottom

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list      # the Home page key-figures row is a definition list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Background: background.md
  - Methodology:
      - methodology/index.md
      - methodology/screening.md
      - methodology/permeability.md
      - methodology/displacement.md
      # Method entries are PATHS ONLY, with no hand-written title. Each label comes from the YAML
      # front-matter `title:` that scripts/gen_site_pages.py writes into every generated method
      # page from method_labels.py -- so renaming a method's display label is a one-line change
      # there and reaches the heading and the sidebar together, instead of needing a matching
      # edit here that was easy to forget. (Note MkDocs does NOT read the H1 for this: drop the
      # front matter and it falls back to the FILENAME, which renders "clearance_looped" as
      # "Clearance looped".)
      #
      # The file LIST is still manual, and cannot be automated without a new dependency: MkDocs
      # has no way to auto-populate one section of an otherwise explicit nav (mkdocs-awesome-nav
      # does it, but that is another pinned package in the deploy workflow). Adding or retiring a
      # method therefore still means a line here. Order matches the METHODS registry in
      # scripts/gen_site_pages.py; dream_come_true is intentionally absent, see exclude_docs
      # above.
      - Methods:
          - methodology/methods/index.md
          - methodology/methods/peel.md
          - methodology/methods/clearance.md
          - methodology/methods/clearance_looped.md
          - methodology/methods/greedy_arterial_buildable.md
          - methodology/methods/cycle_native.md
          - methodology/methods/topology.md
          - methodology/methods/resistance_lp.md
          - methodology/methods/greedy_arterial_access_displacement.md
          - methodology/methods/osm_footpaths.md
          - methodology/methods/euclidean_grid.md
  - Results:
      - results/frontier.md
      - results/bakeoff.md
      - results/nairobi.md
  - Reproduce: reproduce.md
  - Team & References: team.md
