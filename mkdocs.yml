# Project site (GitHub Pages; deployed by .github/workflows/deploy-site.yml, which regenerates
# the data-driven pages in CI -- docs/methods/, docs/benchmark.md, and docs/assets/ are NOT
# committed). For a local preview:
#   python3 scripts/gen_site_pages.py   # regenerate data-driven pages from run artifacts
#   mkdocs serve                        # needs mkdocs-material (e.g. `pixi exec --spec mkdocs-material mkdocs serve`)
site_name: reblock · REU Slum Optimization
site_description: >-
  Generating and evaluating road-network proposals for informal urban settlements —
  a Stony Brook University REU project.
site_url: https://jmendoza167.github.io/REU_Slum_Optimization/
repo_url: https://github.com/jmendoza167/REU_Slum_Optimization
repo_name: jmendoza167/REU_Slum_Optimization

# Internal working notes stay out of the published site (the files themselves are untouched);
# _intro.md is the handwritten partial the generator folds into index.md, not a page of its own;
# metrics-north-star.md is internal design-direction writing that links into superpowers/, so it
# ships with those notes rather than as a public page.
exclude_docs: |
  superpowers/
  _intro.md
  metrics-north-star.md

theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.top
    - navigation.footer
    - navigation.indexes  # a section's index.md is the section's own landing page (Methods)
    - toc.follow          # multi-page site: real page nav on the left, each page's TOC on the right
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/sbu.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Background: background.md
  - Methodology: methodology.md
  - Methods:
      - methods/index.md
      - Peel: methods/peel.md
      - Clearance: methods/clearance.md
      - Looped Tree: methods/clearance_looped.md
      - Throughways: methods/greedy_arterial_buildable.md
      - OSM Footpaths: methods/osm_footpaths.md
      - Grid: methods/euclidean_grid.md
      - Dream Come True: methods/dream_come_true.md
  - Results: benchmark.md
  - Team & References: team.md
