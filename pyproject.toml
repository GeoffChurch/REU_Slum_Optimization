[project]
name = "reblock"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
# Pure-Python / PyPI runtime deps go here. Heavy binary deps (the geospatial
# and traffic-sim stack) are declared as conda-forge packages under
# [tool.pixi.dependencies] instead — see the note there.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reblock"]

# ---------------------------------------------------------------------------
# pixi: environment + dependency management (conda-forge + PyPI, locked)
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
# Add "osx-arm64" / "osx-64" / "win-64" here when collaborators are on those.
platforms = ["linux-64"]

# Runtime deps resolved from conda-forge (binary-correct GDAL/GEOS stack).
[tool.pixi.dependencies]
python = ">=3.11,<3.13"
geopandas = "*"
pyarrow = "*"

# Install the reblock package itself, editable, from this directory.
[tool.pixi.pypi-dependencies]
reblock = { path = ".", editable = true }

# Dev-only tooling, kept out of the runtime dependency set.
[tool.pixi.feature.dev.dependencies]
mypy = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
typecheck = "mypy --strict src tests"
lint = "ruff check ."
fmt = "ruff format ."
check = { depends-on = ["lint", "typecheck", "test"] }

# ---------------------------------------------------------------------------
# Tooling config
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=reblock --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ext"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["reblock"]
branch = true
