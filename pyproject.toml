[project]
name = "reblock"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
# Pure-Python / PyPI runtime deps go here. Heavy binary deps (the geospatial
# and traffic-sim stack) are declared as conda-forge packages under
# [tool.pixi.dependencies] instead — see the note there.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reblock"]

# ---------------------------------------------------------------------------
# pixi: environment + dependency management (conda-forge + PyPI, locked)
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
# Add "osx-arm64" / "osx-64" / "win-64" here when collaborators are on those.
platforms = ["linux-64", "osx-arm64"]

# Runtime deps resolved from conda-forge (binary-correct GDAL/GEOS stack).
[tool.pixi.dependencies]
python = ">=3.11,<3.13"
geopandas = "*"
# pandas is used directly (reblock.derive.access builds pd.Series), so declare
# it explicitly rather than leaning on it arriving transitively via geopandas.
pandas = "*"
pyarrow = "*"
networkx = "*"
scipy = "*"
matplotlib-base = "*"
pyshp = "*"
hydra-core = "*"
# Backs reblock.cache's content-addressed L2 derivation cache (joblib.Memory).
joblib = "*"
segno = "*"

# Install the reblock package itself, editable, from this directory.
[tool.pixi.pypi-dependencies]
reblock = { path = ".", editable = true }
topology = { path = "ext/topology", editable = true }

# Dev-only tooling, kept out of the runtime dependency set.
[tool.pixi.feature.dev.dependencies]
mypy = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"   # parallel test execution (-n auto) -- the suite is CPU-bound, not serial
ruff = "*"
# geopandas/shapely ship no py.typed marker; these are the upstream typeshed
# stub packages (not an ignore_missing_imports shim) so contracts.py's use of
# GeoDataFrame/Polygon/CRS stays fully checked under mypy --strict.
types-geopandas = "*"
types-shapely = "*"
# PyYAML ships no py.typed marker either; same upstream-stub pattern as above so
# tests/data/test_osm_extract.py's `import yaml` stays fully checked.
types-pyyaml = "*"
# Builds and type-checks the web/ widget bundle. Pinned to the same major as
# .github/workflows/deploy-site.yml's actions/setup-node, so a type error cannot pass locally and
# fail in the site build (or the reverse).
nodejs = "22.*"

# web/package.json pins "typescript" to the latest 5.x (not 7.x, which `npm install
# typescript@latest` resolves to as of 2026-08): TypeScript 7 is a ground-up Go-ported
# reimplementation, not an incremental major on the 5.x lineage. This project only uses
# TypeScript for `tsc --noEmit` checking -- esbuild does all transpiling -- so 5.x costs
# nothing we need, while 7.x's less-settled diagnostics and inference would be what later
# tasks end up debugging widget code against. Declined deliberately; not staleness.

# Research/analysis stack for scripts/ and the OT retrieval work. Deliberately NOT in
# [tool.pixi.dependencies]: no `src/reblock` module imports these, so they are not runtime
# dependencies of the package -- same grouping-by-purpose intent as the dev feature above
# (which is likewise always present in the default environment).
[tool.pixi.feature.research.dependencies]
# Reference OT/GW solvers. scratchpad/ot/ot_gw.py hand-rolled entropic GW + unbalanced
# log-domain Sinkhorn because POT was not installed; POT is the independent implementation
# `real_gw_dist` -- the independent variable in the pair-matrix result -- is checked against,
# and it supplies gromov_barycenters for the barycenter-consensus work.
pot = "*"
# Independent check on scripts/pair_matrix.py's hand-rolled within-recipient fixed-effects
# regression (the cluster-preserving permutation test stays the primary significance check).
statsmodels = "*"
# Masked normalized cross-correlation (Padfield 2012) for the Phase 2 retrieval index.
scikit-image = "*"

[tool.pixi.environments]
default = { features = ["dev", "research"], solve-group = "default" }

[tool.pixi.tasks]
# Split the same way typecheck is split below (typecheck-py + web-check, composed by typecheck):
# web/'s transform.ts unit tests otherwise run only when a human types `npm test` by hand. CI
# (.github/workflows/ci.yml) invokes `pixi run test`, so folding web-test in here is what puts
# those tests on the gate -- with no new CI step for a future workflow edit to forget.
test-py = "pytest"
web-test = { cmd = "npm ci && npm test", cwd = "web" }
test = { depends-on = ["test-py", "web-test"] }
typecheck-py = "mypy --strict src tests scripts/crossblock_probe.py scripts/calibrate_permeability.py scripts/perf/records.py scripts/perf/region_cap_report.py scripts/_default_road.py"
web = { cmd = "npm ci && npm run build", cwd = "web" }
web-check = { cmd = "npm ci && npm run check", cwd = "web" }
typecheck = { depends-on = ["typecheck-py", "web-check"] }
lint = "ruff check ."
fmt = "ruff format ."
check = { depends-on = ["lint", "typecheck", "test"] }
run = "python -m reblock.run"
compare = "python -m reblock.compare"
regen-examples = "bash scripts/regenerate_examples.sh"

# ---------------------------------------------------------------------------
# Tooling config
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
# Named scripts only, NOT the whole scripts/ dir: the pre-existing scripts/fetch_kblock_fixtures.py
# (Task 0) has its own pre-existing --strict findings and was never covered by this config. Files
# are added here as they are made strict-clean -- scripts/perf/{records,region_cap_report}.py are
# the typed boundary and analysis for the region-cap experiments, and are listed so the dataclasses
# that replaced their string-keyed dict access cannot silently rot back.
files = ["src", "tests", "scripts/crossblock_probe.py", "scripts/calibrate_permeability.py",
         "scripts/perf/records.py", "scripts/perf/region_cap_report.py", "scripts/_default_road.py"]
# topology is installed via a PEP 660 "strict" editable install, whose .pth
# registers a sys.meta_path finder at runtime rather than a plain sys.path
# entry — mypy's static .pth scan can't see through that, so point it at the
# source tree directly (this is not an ignore_missing_imports shim: topology
# ships py.typed, so mypy reads its real source — though parts of the graph
# layer are unannotated, see the tests.* override below). `src` is on the path so
# `reblock.*` (src layout) resolves canonically; `explicit_package_bases` then
# names every file from these bases + the cwd, so a namespace `tests/` file gets
# exactly ONE module name (`tests.methods.foo`) — not also a rootless top-level
# `foo`. Without it, `mypy tests` was fatal with a duplicate-module error
# ("test_arterial" vs "tests.methods.test_arterial") and silently checked nothing.
explicit_package_bases = true
mypy_path = ["src", "ext/topology"]

[[tool.mypy.overrides]]
# Tests were never actually strict-checked (the duplicate-module error above made
# `mypy tests` fatal, silently). Rather than annotate every test with `-> None`,
# relax the def/call-annotation strictness for tests; genuine type errors
# (arg-type, union-attr, index, ...) in tests ARE still checked.
# disallow_untyped_calls = false is also what lets tests call topology's
# unannotated graph helpers (graphFromMyFaces, define_roads, build_all_roads, ...)
# without a per-call `# type: ignore[no-untyped-call]` — NOT topology's py.typed,
# which alone would not silence no-untyped-call for an unannotated function.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# tests/scoring_fixtures.py is imported bare (`from scoring_fixtures import ...`), not as
# `tests.scoring_fixtures` — a deliberate pattern so pytest's sys.path (not a package name)
# resolves it at runtime. mypy can't resolve the bare name from mypy_path/explicit_package_bases;
# this override silences that import-not-found without touching the import itself.
module = ["scoring_fixtures"]
ignore_missing_imports = true

# topology's pre-existing (unannotated) graph implementation transitively
# imports untyped third-party libraries. These overrides target *those*
# libraries, not topology itself — topology's own public surface
# (topology/__init__.py, topology/graph/complexity.py) stays fully checked.
[[tool.mypy.overrides]]
module = ["networkx.*", "scipy.*", "shapefile.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# joblib (backs reblock.cache's L2 derivation cache) ships no py.typed marker
# and, unlike geopandas/shapely, has no upstream types-joblib stub package to
# install instead — so this is a plain ignore_missing_imports shim, not a
# preference over real stubs.
module = "joblib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyogrio (backs reblock.data.osm_extract.read_pbf_lines' OGR-side `where` filter) ships no
# py.typed marker. A types-pyogrio stub exists on PyPI but not on conda-forge, and every other
# stub package here (types-geopandas, types-shapely, types-pyyaml) is installed as a conda-forge
# package to match [tool.pixi.dependencies]'s binary-correct GDAL/GEOS stack -- so, like joblib
# above, this is a plain ignore_missing_imports shim, not a preference over real stubs.
module = "pyogrio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy 2.5's bundled stubs (a .pyi file) use PEP 695 `type` statements
# (Python 3.12+ only syntax), which fail to parse under our
# python_version = "3.11" target; this is a numpy/mypy version mismatch
# unrelated to topology's typing. follow_imports_for_stubs makes
# follow_imports apply to .pyi files too (by default it only affects .py).
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# topology.graph.{my_graph,my_graph_helpers} are the pre-existing, deliberately
# unannotated legacy graph implementation (the brief scopes typing to the new
# facade — topology/__init__.py and topology/graph/complexity.py — not to
# retrofitting ~1000 lines of legacy code). follow_imports=silent still parses
# them (so MyGraph/MyEdge/... are real inferred types for consumers, not Any)
# but suppresses their own missing-annotation noise.
module = [
    "topology.graph.my_graph",
    "topology.graph.my_graph_helpers",
    "topology.utils.lazy_property",
]
follow_imports = "silent"

[[tool.mypy.overrides]]
# reblock/data/provision.py imports download_dataverse_blocks/download_capetown_buildings/
# CT_BBOX from scripts/fetch_kblock_fixtures.py -- a pre-existing script (Task 0, out of
# scope here) with its own pre-existing --strict findings, previously excluded from `files`
# (see the "files" comment above) precisely so it wasn't checked. Since provision.py *is*
# in `files`, mypy's default follow_imports="normal" would transitively re-check that
# script's whole body anyway. follow_imports=silent still parses it (so the imported
# names have real inferred types at provision.py's call sites, not Any) but suppresses
# its own unrelated errors, mirroring the topology.graph.my_graph* override above.
module = "scripts.fetch_kblock_fixtures"
follow_imports = "silent"

[[tool.mypy.overrides]]
# scripts/pair_matrix.py and scripts/osm_census.py are likewise deliberately excluded from
# `files` (see the comment above) -- pair_matrix.py imports the gitignored `scratchpad/ot/`
# spike (mypy can never resolve it: that directory is never on disk in CI/a fresh checkout) and
# osm_census.py has its own pre-existing --strict findings, neither in scope here. tests/test_
# pair_matrix.py and tests/test_osm_census.py import both scripts to exercise their real
# functions, which -- since those test files ARE in `files` -- makes mypy's default
# follow_imports="normal" transitively re-check both scripts' whole bodies anyway.
# follow_imports=silent still parses them (so the imported names have real inferred types at the
# test files' call sites, not Any) but suppresses their own unrelated errors, exactly mirroring
# the scripts.fetch_kblock_fixtures override above.
module = ["scripts.pair_matrix", "scripts.osm_census"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# complexity.py is the typed facade: its own signatures (k_complexity,
# define_roads_on) are fully annotated and checked. It necessarily calls into
# the legacy untyped helpers above, which --strict's disallow_untyped_calls
# would otherwise flag at these call sites specifically.
module = "topology.graph.complexity"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Same situation as topology.graph.complexity above: reblock.derive.parcel_graph
# is fully annotated itself, but constructs topology's legacy MyNode/MyEdge/
# MyFace and calls graphFromMyFaces directly -- those constructors/functions
# are untyped (see the my_graph/my_graph_helpers override above), which
# --strict's disallow_untyped_calls would otherwise flag at these call sites.
module = "reblock.derive.parcel_graph"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Same situation as reblock.derive.parcel_graph above: reblock.eval.kcomplexity
# is fully annotated itself, but drives topology's legacy MyGraph directly --
# graph.define_roads()/myedges() are untyped (see the my_graph/
# my_graph_helpers override above), which --strict's disallow_untyped_calls
# would otherwise flag at these call sites.
module = "reblock.eval.kcomplexity"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Same situation as reblock.derive.parcel_graph above: reblock.methods.topology
# is fully annotated itself, but drives topology's legacy MyGraph directly --
# graph.define_roads()/define_interior_parcels()/myedges() and the
# build_all_roads() facade call are all untyped (see the my_graph/
# my_graph_helpers override above), which --strict's disallow_untyped_calls
# would otherwise flag at these call sites.
module = "reblock.methods.topology"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=reblock --cov-report=term-missing -n auto --dist worksteal"
# tests/test_crossblock_probe.py imports `scripts.crossblock_probe`. scripts/ is a
# regular package (scripts/__init__.py) but lives at the repo root, which pytest's
# rootdir-based sys.path insertion (anchored at tests/, since tests/ has no
# __init__.py -- see the mypy_path note below) does not add. This is the minimal
# path tweak to make that import resolve at test-collection time.
pythonpath = ["."]
# joblib's numpy pickler (numpy_pickle.py) sets `array.shape`, which NumPy 2.5
# deprecated; it fires on every L2-cache round-trip of a numpy-backed object.
# Upstream joblib issue (not our code) -- scope the ignore to that one message so
# genuine warnings stay visible.
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]
markers = [
    "network: hits the network (Geofabrik/Overpass/Open Buildings); deselect with -m 'not network'",
    "slow: needs a warm derivation cache and re-solves a block; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ext"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["reblock"]
branch = true
