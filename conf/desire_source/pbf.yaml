# Local Geofabrik .osm.pbf desire-line source -- the bulk path used by the country-wide census.
# OSMDesireLines (conf/desire_source/osm.yaml) remains for bboxes outside the extracts.
defaults:
  - _footpath_tags
_target_: reblock.data.osm_extract.PbfDesireLines
# Built as a `Path`, because YAML has no path type and a bare string would reach the source as a
# `str`, which it cannot `.stat()`. Supply it as
#   desire_source.pbf_path._args_=[~/.cache/reblock/osm_pbf/south-africa-latest.osm.pbf]
pbf_path: {_target_: pathlib.Path, _args_: ["???"]}
tags: ${footpath_tags}
