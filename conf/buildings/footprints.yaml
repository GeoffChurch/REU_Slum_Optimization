# Tier 3: real Open Buildings OUTLINES for the blocks a run proposes on. The screen, the counts and
# growth depth still run on points over the whole corpus; only the chosen members' polygon TILES are
# fetched (one ~320 MB tile per S2 cell, cached as parquet, so a region usually costs one tile).
# Measured: discs over-read served-at-3.5 m by 34% against these outlines.
tier:
  _target_: reblock.buildings.Footprints
  _partial_: true
member_buildings:
  _target_: reblock.data.footprints.FootprintTiles
  cache_dir: {_target_: hydra.utils.get_object, path: reblock.data.footprints.DEFAULT_FOOTPRINT_CACHE}
  min_confidence: 0.7   # Open Buildings' own threshold, as for the points (OB_MIN_CONFIDENCE)
  fetch: {_target_: hydra.utils.get_method, path: reblock.data.footprints.fetch_tile}
