_target_: reblock.data.kblock.KblockSource
blocks_path: tests/data/kblock/blocks_capetown_sample.parquet
buildings_path: tests/data/kblock/buildings_capetown_sample.parquet
region_id: capetown
min_buildings: 10
# The source's own flat load filter, which build_regions narrows to a region's members -- NOT the
# top-level `block_ids`, which are the region seed groups.
block_ids: null
# The building-geometry tier and the data feeding it, chosen together by the `buildings`
# config group so a tier can never be paired with data that cannot supply it.
building_tier: ${buildings.tier}
member_buildings: ${buildings.member_buildings}
