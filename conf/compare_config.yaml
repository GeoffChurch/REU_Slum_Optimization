defaults:
  - data: dji
  - screen: identity
  - eval: kcomplexity
  - _self_

# The methods available, then the names to actually run. Overriding the names via
# CLI is clean -- `methods=[dijkstra,peel]` (topology is slow, minutes/block).
all_methods:
  dijkstra: {_target_: reblock.methods.dijkstra.DijkstraReblocker}
  peel: {_target_: reblock.methods.peel.PeelReblocker}
  topology: {_target_: reblock.methods.topology.TopologyMethod}
  mesh: {_target_: reblock.methods.mesh.MeshReblocker}
  greedy_arterial_buildable: {_target_: reblock.methods.arterial.GreedyArterialReblocker, mode: buildable, objective: directness}
  # NOTE: the aspirational mode (ideal chords) is not a valid ceiling under the current
  # vertex-based network_efficiency scoring (it undercounts sparse-vertex chords; densifying is
  # too slow). Deferred pending the line-proximity metric in docs/metrics-north-star.md.
methods: [dijkstra, peel, topology, mesh, greedy_arterial_buildable]

shapefile: ???
region_id: phule
assumed_crs: null
max_blocks: 5
block_ids: null

hydra:
  job:
    chdir: false
