defaults:
  - data: dji
  - screen: identity
  - region_builder: identity
  - eval: kcomplexity
  - substrate: chord_diag
  - buildings: spacing
  - desire_source: osm
  - donor_pool: capetown      # read only by desire_source=pool
  - metric: depth_density_proxy
  - building_count: open_buildings
  - permeability
  - betweenness
  - _self_

# The methods available, then the names to actually run. Overriding the names via
# CLI is clean -- `methods=[clearance,greedy_arterial_buildable]` (topology is slow, minutes/block).
# NOTE: the coverage/frontage baseline `peel` is deliberately absent -- it "wins" coverage trivially
# by paving everything and only clutters the sparse-method comparison (and set the misleading shared
# cost cap the old AUC used). It stays a runnable method (conf/method/peel.yaml) and test fixture;
# just not benchmarked. The registry order below also keys the plot colour palette.
all_methods:
  topology: {_target_: reblock.methods.topology.TopologyMethod, alpha: 2.0, seed: 0, road_width_m: 7.0}
  greedy_arterial_buildable:
    _target_: reblock.methods.arterial.GreedyArterialReblocker
    realizer: {_target_: reblock.methods.arterial.SnapToBoundary, lam: 2.0}
    objective: {_target_: reblock.methods.arterial.Directness}
    cost: {_target_: reblock.methods.arterial.Length}
    max_roads: 15
    anchors: {_target_: reblock.methods.arterial.Uncapped, n: 32}
    budget: {_target_: reblock.methods.arterial.NoBudget}
    top_k: 8
    road_width_m: 7.0
    workers: 16
    engine: {_target_: reblock.methods.arterial.LazyEngine, policy: {_target_: reblock.methods.arterial.Grow}, rescore_every: 0}
  greedy_arterial_repulsion:
    _target_: reblock.methods.arterial.GreedyArterialReblocker
    realizer: {_target_: reblock.methods.arterial.SnapToBoundary, lam: 2.0}
    objective: {_target_: reblock.methods.arterial.Directness}
    cost: {_target_: reblock.methods.arterial.Repulsion}
    max_roads: 15
    anchors: {_target_: reblock.methods.arterial.Uncapped, n: 32}
    budget: {_target_: reblock.methods.arterial.NoBudget}
    top_k: 8
    road_width_m: 7.0
    workers: 16
    engine: {_target_: reblock.methods.arterial.LazyEngine, policy: {_target_: reblock.methods.arterial.Grow}, rescore_every: 0}
  # aspirational (ideal straight chords, not snapped to frontages) is a DIAGNOSTIC -- it isolates
  # the effect of frontage-snapping, NOT a universal directness ceiling. directness/E measure
  # internal circulation (all-pairs, door-to-door incl. the walk-to-road legs); under that honest
  # metric a frontage-hugging buildable road gives every parcel a short walk leg, so on a compact
  # block buildable tends to match or beat aspirational. The through-road advantage shows on
  # deep/elongated regions, where a straight road shortcuts trips a frontage tree can't.
  # ACCESS objective: greedily maximize 1 - access_burden/base_burden, i.e. optimize sum of squared
  # access depths directly. `GreedyArterialReblocker` has supported `objective: access` since it was
  # written, but every configured variant used `directness`, so it had never been run
  # (notes/2026-08-08-c5-the-access-objective-was-never-wired-up-and-it-wins.md).
  #
  # BOTH costs are configured because which one wins depends on the road width being priced, and
  # neither dominates (notes/2026-08-08-c6-c7-tuning-the-access-objective-and-what-it-draws.md):
  #   repulsion    best at LANE width (2 m): AUC 0.013 vs resistance_lp's 0.080
  #   displacement best at STREET width (7 m): AUC 0.115 vs resistance_lp's 0.137
  # `cost: displacement` optimizes benefit-per-displacement, and displacement is the x-axis these
  # methods are compared on -- legitimate, since it is the real cost and any method may target it,
  # but it is optimizing the axis being reported and that must be stated alongside any result.
  # (The earlier finding that cost=displacement degenerates on sparse fabric was measured against
  # the DIRECTNESS objective and does not transfer: an access gain requires actually fronting
  # parcels, so a gap-hugging road earns nothing.)
  #
  # `ShortlistEngine`, not `LazyEngine` -- unlike the directness variants above. CELF's guarantee
  # needs the objective to be submodular, which holds for directness but NOT for access-burden
  # reduction: measured on 3 blocks x 2 costs, lazy diverged from the exact greedy on 6 of 6 (final
  # burden 0.0733 vs 0.0867 and 0.2600 vs 0.2933 among others), in both directions, and was SLOWER
  # in 4 of 6 -- an approximation for no speed. ShortlistEngine (tier 2: rank every candidate by a
  # cheap first-order estimate, score only the top k=512 exactly) is what makes access affordable
  # at region scale at all -- 11.6h unfinished -> ~80 min uncapped. `max_anchors: 128` (this pair
  # ONLY; directness/CELF above stay `Uncapped`) stacks a further 7.6x median
  # (2.5-12.2x, 6/6 regions, no detectable quality difference at matched displacement) -- ~330x
  # combined, 11.6h unfinished to ~10 min (notes/2026-08-11-max-anchors-is-a-region-scale-win.md).
  # The cap changes which candidates exist, so it changes directness outcomes too, and every
  # measurement behind it is objective=access. It is now `PerLineFallback`'s cap, which does not
  # hold on a network of many lines: its anchor counts reach 112 to 525 over 0 to 607 committed
  # segments on ZAF.9.3.1_1_20269 (`HardCap` is the sampler whose cap holds; anchors.py).
  # The budget is `ScoredArea(share: 0.20)`, the research lineup's own scored area D (the share
  # of each building's footprint the corridor covers, weighted by footprint area: stop.py),
  # checked before each commit with the crossing road kept -- the same 0.20 that puts
  # resistance_lp/cycle_native clear of the Lens A budget, so the lens binds before the method's
  # own stop does. Not `DestroyedArea` (a touched building counted whole; selectable): at 0.20 it
  # stopped the six-block study at scored D 0.018-0.072, short of the 0.05 and 0.10 lens budgets
  # on most blocks (owner 2026-10-18; BACKLOG has the decision on one definition). `max_roads:
  # 1000` is a SAFETY CAP expected never to bind; every proposal records why it stopped
  # (params["stop"]: budget, no_gain or max_roads) and both shares at the stop, so a bind is
  # seen. History: a road cap was the budget here (15, then 60, then the research lineup's
  # 300), and it graded the cap rather than the method -- at 60 this pair reached area D only 0.011
  # to 0.044 on large blocks -- while 55 of 62 lineup networks at 300 ended with every parcel at
  # depth 1, at a median 54 road km/km2. BOTH variants move together: they are a matched pair
  # differing only in `cost`, so a difference in budget would make the one comparison they exist
  # for meaningless.
  greedy_arterial_access_repulsion:
    _target_: reblock.methods.arterial.GreedyArterialReblocker
    realizer: {_target_: reblock.methods.arterial.SnapToBoundary, lam: 2.0}
    objective: {_target_: reblock.methods.arterial.Access}
    cost: {_target_: reblock.methods.arterial.Repulsion}
    max_roads: 1000
    anchors: {_target_: reblock.methods.arterial.PerLineFallback, n: 32, max_anchors: 128}
    budget: {_target_: reblock.methods.arterial.ScoredArea, share: 0.20}
    top_k: 8
    road_width_m: 7.0
    workers: 16
    engine: {_target_: reblock.methods.arterial.ShortlistEngine, k: 512, threads: 8}
  greedy_arterial_access_displacement:
    _target_: reblock.methods.arterial.GreedyArterialReblocker
    realizer: {_target_: reblock.methods.arterial.SnapToBoundary, lam: 2.0}
    objective: {_target_: reblock.methods.arterial.Access}
    cost: {_target_: reblock.methods.arterial.Displacement}
    max_roads: 1000
    anchors: {_target_: reblock.methods.arterial.PerLineFallback, n: 32, max_anchors: 128}
    budget: {_target_: reblock.methods.arterial.ScoredArea, share: 0.20}
    top_k: 8
    road_width_m: 7.0
    workers: 16
    engine: {_target_: reblock.methods.arterial.ShortlistEngine, k: 512, threads: 8}
  # Two operating points of the street-priced access arterial, one per anchor sampler (anchors.py),
  # from the six-block study of 2026-10-18 (research/roadless/NOTES.md, "The arterial: an
  # incremental gain, a cap that holds, a displacement budget"; arterial_rows/summary_*.csv): neither
  # dominates the other.
  #   greedy_arterial_access_displacement (above), QUALITY-FIRST: PerLineFallback(32, 128), whose
  #     "cap" admits one extra anchor per network line (up to 304 anchors on the study's blocks).
  #     Ahead of HardCap at area D 0.05 on 6310 (+0.06 L_P); gives up per-step time, which grows
  #     with the network (median step 8.8-18.6 s against 8.4-15.3 s).
  #   greedy_arterial_access_displacement_fast (here), SPEED-FIRST: HardCap(32, 128), at most 128
  #     anchors on any network, a flat per-step cost: 0.74-0.80x the wall on the two largest blocks
  #     (8480, 38616). Gives up the vertex family once the cap binds, so it can need more commits to
  #     the same budget (2.0x the wall on 39240) and trailed at D 0.05 on 6310 (ahead on 40144).
  # The repulsion twin keeps the quality-first sampler (the matched pair moves together).
  greedy_arterial_access_displacement_fast:
    _target_: reblock.methods.arterial.GreedyArterialReblocker
    realizer: {_target_: reblock.methods.arterial.SnapToBoundary, lam: 2.0}
    objective: {_target_: reblock.methods.arterial.Access}
    cost: {_target_: reblock.methods.arterial.Displacement}
    max_roads: 1000
    anchors: {_target_: reblock.methods.arterial.HardCap, n: 32, max_anchors: 128}
    budget: {_target_: reblock.methods.arterial.ScoredArea, share: 0.20}
    top_k: 8
    road_width_m: 7.0
    workers: 16
    engine: {_target_: reblock.methods.arterial.ShortlistEngine, k: 512, threads: 8}
  greedy_arterial_aspirational:
    _target_: reblock.methods.arterial.GreedyArterialReblocker
    realizer: {_target_: reblock.methods.arterial.IdealChord}
    objective: {_target_: reblock.methods.arterial.Directness}
    cost: {_target_: reblock.methods.arterial.Length}
    max_roads: 15
    anchors: {_target_: reblock.methods.arterial.Uncapped, n: 32}
    budget: {_target_: reblock.methods.arterial.NoBudget}
    top_k: 8
    road_width_m: 7.0
    workers: 16
    engine: {_target_: reblock.methods.arterial.ExactEngine}
  greedy_arterial_displacement:
    _target_: reblock.methods.arterial.GreedyArterialReblocker
    realizer: {_target_: reblock.methods.arterial.IdealChord}
    objective: {_target_: reblock.methods.arterial.Directness}
    cost: {_target_: reblock.methods.arterial.Displacement}
    max_roads: 15
    anchors: {_target_: reblock.methods.arterial.Uncapped, n: 32}
    budget: {_target_: reblock.methods.arterial.NoBudget}
    top_k: 8
    road_width_m: 7.0
    workers: 16
    engine: {_target_: reblock.methods.arterial.ExactEngine}
  clearance: {_target_: reblock.methods.clearance.ClearanceReblocker, substrate: "${substrate}", repulsion: 0.0, depth_target: 2, max_roads: 400, road_width_m: 7.0, price: {_target_: reblock.transparency.Opaque}, free_first: {_target_: reblock.free_first.HoldNothing}}
  demand_greedy: {_target_: reblock.methods.demand_greedy.DemandGreedyReblocker, desire_source: "${desire_source}", substrate: "${substrate}", buffer_m: 3.0, eps: 0.1, gamma: 1.0, depth_target: 2, max_roads: 400, road_width_m: 7.0}
  # demand_greedy routed toward curvature-aware betweenness ridges (raw counts). Beats clearance on
  # both lenses on 220 small blocks (Lens A +0.040, Lens B -0.009), on held-out Cape Town and Nairobi
  # blocks, and on 36 large ones -- all at these settings. Same builder settings as
  # conf/method/demand_greedy.yaml; a sweep of them and of the field's post-processing found no better
  # point. Plain cycle_native beats it on both lenses, large blocks and small (Lens A +0.044 on the
  # 220): it stays on the frontier for road, ~190 m at the Lens A cut against cycle_native's ~288 m.
  # Gives up runtime: the field takes minutes on a large block where clearance takes seconds
  # (Bloekombos: ~116 s at 40 workers, the observed pass alone).
  betweenness_tree: {_target_: reblock.methods.demand_greedy.DemandGreedyReblocker, desire_source: "${betweenness.raw}", substrate: "${substrate}", buffer_m: 3.0, eps: 0.1, gamma: 1.0, depth_target: 2, max_roads: 400, road_width_m: 7.0}
  # demand_greedy routed toward curvature-aware betweenness ridges (prior-deviance contrast). Ties raw
  # on 220 small blocks (Lens A +0.047 over clearance, Lens B -0.011) and in Nairobi, and leads it on
  # both lenses on a fresh Cape Town sample; raw leads it on 36 large blocks. Beats clearance on both
  # lenses everywhere measured -- all at these settings. Same builder settings as
  # conf/method/demand_greedy.yaml. Plain cycle_native beats it on both lenses, large blocks and
  # small: it stays on the frontier for road, ~190 m at the Lens A cut against cycle_native's ~288 m.
  # Gives up runtime: the field takes minutes on a large block where clearance takes seconds
  # (Bloekombos: ~200 s at 40 workers), since the contrast needs the prior pass too.
  betweenness_tree_contrast: {_target_: reblock.methods.demand_greedy.DemandGreedyReblocker, desire_source: "${betweenness.contrast}", substrate: "${substrate}", buffer_m: 3.0, eps: 0.1, gamma: 1.0, depth_target: 2, max_roads: 400, road_width_m: 7.0}
  # The loop-closing refiner around betweenness_tree. The loop settings are the region-scale values
  # the frontier study measured (conf/example/explore.yaml's clearance_looped tuning), not
  # conf/method/loop_closure.yaml's block-scale 0.12 / 45. Better than clearance_looped on Lens A in
  # 94% of 36 large blocks and on Lens B in 78%. cycle_native_betweenness beats it on both lenses
  # (Lens A +0.026, Lens B -0.003): it stays on the frontier for road, 6.7 km against ~9 km (full
  # networks, median).
  # Gives up road and runtime against the tree: 6.7 km against 5.2 km, and minutes where clearance
  # takes seconds (Bloekombos: ~116 s at 40 workers, the observed pass).
  betweenness_looped:
    _target_: reblock.methods.loop_closure.LoopClosureRefiner
    base: {_target_: reblock.methods.demand_greedy.DemandGreedyReblocker, desire_source: "${betweenness.raw}",
           substrate: "${substrate}", buffer_m: 3.0, eps: 0.1, gamma: 1.0, depth_target: 2,
           max_roads: 400, road_width_m: 7.0}
    budget_frac: 0.30
    min_bridges_per_m: 0.01
    max_loops: 400
    min_loop_len_m: 40.0
    search_radius_m: 60.0
    snap_lam: 2.0
    max_candidates: 1500
    road_width_m: 7.0
  # The loop-closing refiner around betweenness_tree_contrast. The loop settings are the region-scale
  # values the frontier study measured (conf/example/explore.yaml's clearance_looped tuning), not
  # conf/method/loop_closure.yaml's block-scale 0.12 / 45. cycle_native_betweenness_contrast beats it
  # on both lenses on 36 large blocks (Lens A +0.041, Lens B -0.005): it stays on the frontier for
  # road, 6.7 km against ~9 km (full networks, median).
  # Gives up road and runtime against the tree: 6.7 km against 5.2 km, and minutes where clearance
  # takes seconds (Bloekombos: ~200 s at 40 workers, prior pass included).
  betweenness_looped_contrast:
    _target_: reblock.methods.loop_closure.LoopClosureRefiner
    base: {_target_: reblock.methods.demand_greedy.DemandGreedyReblocker, desire_source: "${betweenness.contrast}",
           substrate: "${substrate}", buffer_m: 3.0, eps: 0.1, gamma: 1.0, depth_target: 2,
           max_roads: 400, road_width_m: 7.0}
    budget_frac: 0.30
    min_bridges_per_m: 0.01
    max_loops: 400
    min_loop_len_m: 40.0
    search_radius_m: 60.0
    snap_lam: 2.0
    max_candidates: 1500
    road_width_m: 7.0
  # cycle_native with its candidate loops routed along curvature-aware betweenness ridges (raw
  # counts): the substrate's edges are shortened along the ridges (reblock.methods.desire_substrate),
  # and cycle_native still scores every candidate loop by permeability gain per unit displacement.
  # Against plain cycle_native: on 36 large blocks Lens A +0.012, Lens B -0.006 (Nairobi's intervals
  # touch 0); on small blocks Lens A +0.009 on the 220 but a tie on held-out Cape Town and Nairobi.
  # On the (Lens A, Lens B) frontier in 13 of 36 large blocks. Kept beside the contrast preset for
  # runtime: it needs no prior pass. gamma 0.5: measured better than 1, 2 and 0.25.
  # Gives up road and runtime: x1.20 the road at the Lens A cut, and the field's observed pass
  # (Bloekombos: ~116 s at 40 workers) on top of cycle_native's own time x1.16.
  cycle_native_betweenness:
    _target_: reblock.methods.cycle_native.CycleNativeReblocker
    substrate:
      _target_: reblock.methods.desire_substrate.DesireWarpedSubstrate
      base: "${substrate}"
      desire_source: "${betweenness.raw}"
      buffer_m: 3.0
      eps: 0.1
      gamma: 0.5
    max_displacement: 0.20
    max_cycles: 400
    shortlist: 8
    params: "${permeability.params}"
    road_width_m: 7.0
    price: {_target_: reblock.transparency.Opaque}
    free_first: {_target_: reblock.free_first.HoldNothing}
  # cycle_native with its candidate loops routed along curvature-aware betweenness ridges
  # (prior-deviance contrast): the substrate's edges are shortened along the ridges
  # (reblock.methods.desire_substrate), and cycle_native still scores every candidate loop by
  # permeability gain per unit displacement. Against plain cycle_native: on 36 large blocks Lens A
  # +0.012, Lens B -0.005, in both cities; on small blocks Lens A +0.010 with Lens B tied (the 220,
  # and fresh Cape Town; borderline in Nairobi) -- never worse on either lens in any sample. On the
  # (Lens A, Lens B) frontier in 14 of 36 large blocks; greedy_arterial still leads Lens B (+0.005).
  # gamma 0.5, gentler than demand_greedy's 1: measured better than 1, 2 and 0.25.
  # Gives up road and runtime: x1.22 the road at the Lens A cut, and the field's observed and prior
  # passes (Bloekombos: ~200 s at 40 workers) on top of cycle_native's own time x1.18.
  cycle_native_betweenness_contrast:
    _target_: reblock.methods.cycle_native.CycleNativeReblocker
    substrate:
      _target_: reblock.methods.desire_substrate.DesireWarpedSubstrate
      base: "${substrate}"
      desire_source: "${betweenness.contrast}"
      buffer_m: 3.0
      eps: 0.1
      gamma: 0.5
    max_displacement: 0.20
    max_cycles: 400
    shortlist: 8
    params: "${permeability.params}"
    road_width_m: 7.0
    price: {_target_: reblock.transparency.Opaque}
    free_first: {_target_: reblock.free_first.HoldNothing}

  # drainage tree. The gap to demand_greedy is exactly what the desire-line prior is worth.

  # matched permeability with less road than clearance does, so the same loop budget is spent
  # from a cheaper starting point -- the obvious way to improve the flagship.

  # networks close loops within a tight budget where clearance_looped's connectors are the first
  # thing a prefix cuts (5 of 6 blocks have 2-17 cycles in the full network and 0 after
  # displacement-matching, which keeps only 1-33 of 24-166 segments); a 40 m floor excludes exactly
  # the short connectors that score highest on bridges-removed-per-metre and survive truncation.
  # ABLATED (scratchpad/ot/loop_ablation.py, at the example's overrides): min_loop_len_m carries the
  # entire effect and min_bridges_per_m 0.01 -> 0.0 is bit-for-bit inert, so it is NOT changed here.
  # The gain is also settings-dependent -- at the conf defaults (depth_target 1, budget_frac 0.12)
  # the same change is slightly NEGATIVE (0.7370 vs 0.7383); it helps at the example's deeper base.
  resistance_greedy:
    _target_: reblock.methods.resistance_greedy.ResistanceGreedyReblocker
    substrate: "${substrate}"
    max_roads: 400
    shortlist: 6
    loop_radius_m: 0.0
    min_loop_len_m: 40.0
    max_loop_candidates: 400
    min_gain_per_m: 1.0e-06
    seed: 0
    params: ${permeability.params}
    road_width_m: 7.0
  # Whole road set chosen at once by LP, budgeting DISPLACEMENT (what the lenses score) rather than
  # metres. Decides over paths, so connectivity is structural and the route-(A) rounding obstacle
  # dissolves. chunks is a Frank-Wolfe step count. See conf/method/resistance_lp.yaml.
  # max_displacement 0.20, NOT 0.10: a method's own cap must sit clear of the Lens A budget
  # (matched_displacement, 0.10) or the cap binds before the lens does and the lens compares a
  # terminal network against everyone else's truncated prefix. At 0.10 cycle_native stopped at
  # 0.0998 and read `at_budget: False` on the flagship region -- its headline Lens A number was
  # its own cap, not its performance.
  resistance_lp:
    _target_: reblock.methods.resistance_lp.ResistanceLPReblocker
    substrate: "${substrate}"
    max_displacement: 0.20
    max_road_m: 1000000.0
    chunks: 8
    params: ${permeability.params}
    road_width_m: 7.0
    # Each building's factor in the displacement budget (reblock.transparency); Opaque is every
    # factor 1, the plain budget. The same on every cycle_native and clearance entry.
    price: {_target_: reblock.transparency.Opaque}
    # The roads committed before the method's own (reblock.free_first); HoldNothing holds none.
    # The same wherever a price is set.
    free_first: {_target_: reblock.free_first.HoldNothing}
  # Cycle-native: each move is a loop from the street back to the street, so the output is
  # bridgeless by construction and every road can be oriented one-way. See conf/method/cycle_native.yaml.
  cycle_native:
    _target_: reblock.methods.cycle_native.CycleNativeReblocker
    substrate: "${substrate}"
    max_displacement: 0.20
    max_cycles: 400
    shortlist: 8
    params: ${permeability.params}
    road_width_m: 7.0
    price: {_target_: reblock.transparency.Opaque}
    free_first: {_target_: reblock.free_first.HoldNothing}
  # Flow accumulation rather than drainage: route every trip, count edge traffic, keep the busiest.
  # Sparse, can contain loops, does not reach every parcel -- the properties real footpaths have and
  # a drainage tree cannot. flow_quantile is the hierarchy knob (low = footpath web, high = skeleton).
  flow_paths: {_target_: reblock.methods.flow_paths.FlowPathsReblocker, substrate: "${substrate}", destination: all_pairs, iterations: 3, reinforcement: 0.5, flow_quantile: 0.90, max_sources: 400, seed: 0, road_width_m: 7.0}
  flow_paths_noreinforce: {_target_: reblock.methods.flow_paths.FlowPathsReblocker, substrate: "${substrate}", destination: all_pairs, iterations: 1, reinforcement: 0.0, flow_quantile: 0.90, max_sources: 400, seed: 0, road_width_m: 7.0}
  clearance_grid: {_target_: reblock.methods.clearance.ClearanceReblocker, substrate: {_target_: reblock.methods.substrates.GridSubstrate, res: 1.5}, repulsion: 0.0, depth_target: 2, max_roads: 400, road_width_m: 7.0, price: {_target_: reblock.transparency.Opaque}, free_first: {_target_: reblock.free_first.HoldNothing}}
  clearance_looped:
    _target_: reblock.methods.loop_closure.LoopClosureRefiner
    base: {_target_: reblock.methods.clearance.ClearanceReblocker, substrate: "${substrate}",
           repulsion: 0.0, depth_target: 1, max_roads: 400,
           road_width_m: 7.0,   # depth_target 1 = deeper base (best-of-both)
           price: {_target_: reblock.transparency.Opaque},
           free_first: {_target_: reblock.free_first.HoldNothing}}
    budget_frac: 0.12
    min_bridges_per_m: 0.01
    max_loops: 400
    min_loop_len_m: 40.0
    # search_radius_m 45 m: sufficient for block-scale bases with the uniform max_candidates cap,
    # which bounds the expensive per-pair snap volume regardless of mesh density (see _subsample_pairs).
    search_radius_m: 45.0
    snap_lam: 2.0
    max_candidates: 1500
    road_width_m: 7.0
  osm_footpaths: {_target_: reblock.methods.osm_footpaths.OsmFootpathsReblocker, source: "${desire_source}", road_width_m: 7.0}
  euclidean_grid:
    _target_: reblock.methods.euclidean_grid.EuclideanGridReblocker
    road_width_m: 7.0
    spacing: 60.0
    angle: 0.0
    min_seg_len: 1.0
    street_buffer: 0.5
    seek_density: true
    adaptive: true
    fine_spacing: null                  # null -> spacing / 2
    density_threshold_percentile: 75.0
    parcel_hug_buffer: null             # null -> derived per block from its parcel scale
    parcel_bridge_gap: null             # null -> derived per block from its parcel scale
    follow_parcels: false
    follow_min_coverage: 0.03
    follow_max_coverage: 0.45
    follow_density_gamma: 3.0
    follow_min_component: null          # null -> derived per block from its parcel scale
methods: [topology, clearance, greedy_arterial_buildable]


# Optional: sweep ONE base method over a param's values without hand-writing an all_methods entry
# per value. Expands to `{base}_{param}{value}` methods appended to the run list, e.g.
#   methods=[] 'method_sweep={base: clearance, param: repulsion, values: [-3, 0, 3]}'
method_sweep: null

shapefile: ???
region_id: phule
assumed_crs: null
max_blocks: 5
# Each inner list is one region seed group (region_builder expands it); a singleton is a
# plain single-block compare. null = no explicit groups (the screen decides; identity ->
# all buildable blocks, max_blocks-limited).
block_ids: null

# Screen selection gate (applied to the metric's fine score) + the cheap recall pre-filter
# (keep top-% by proxy before the peel). Calibrated for the default `depth` metric.
proxy_keep_n: 1000

hydra:
  job:
    chdir: false
