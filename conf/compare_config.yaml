defaults:
  - data: dji
  - screen: identity
  - region_builder: identity
  - eval: kcomplexity
  - _self_

# The methods available, then the names to actually run. Overriding the names via
# CLI is clean -- `methods=[dijkstra,peel]` (topology is slow, minutes/block).
all_methods:
  dijkstra: {_target_: reblock.methods.dijkstra.DijkstraReblocker}
  peel: {_target_: reblock.methods.peel.PeelReblocker}
  topology: {_target_: reblock.methods.topology.TopologyMethod}
  mesh: {_target_: reblock.methods.mesh.MeshReblocker}
  greedy_arterial_buildable: {_target_: reblock.methods.arterial.GreedyArterialReblocker, mode: buildable, objective: directness}
  # aspirational (ideal straight chords, not snapped to frontages) is a DIAGNOSTIC -- it isolates
  # the effect of frontage-snapping, NOT a universal directness ceiling. directness/E measure
  # internal circulation (all-pairs, door-to-door incl. the walk-to-road legs); under that honest
  # metric a frontage-hugging buildable road gives every parcel a short walk leg, so on a compact
  # block buildable tends to match or beat aspirational. The through-road advantage shows on
  # deep/elongated regions, where a straight road shortcuts trips a frontage tree can't.
  greedy_arterial_aspirational: {_target_: reblock.methods.arterial.GreedyArterialReblocker, mode: aspirational, objective: directness}
  greedy_arterial_displacement: {_target_: reblock.methods.arterial.GreedyArterialReblocker, mode: aspirational, objective: directness, cost: displacement, corridor_m: 3.0}
  clearance: {_target_: reblock.methods.clearance.ClearanceReblocker, repulsion: 0.0, depth_target: 2, res: 1.5, max_roads: 400}
methods: [dijkstra, peel, topology, mesh, greedy_arterial_buildable]

# Cost axis for the cost-benefit curves (the x every method is graded on):
#   "length"       -> road density (m/ha), the default
#   "displacement" -> cumulative buildings displaced (site inside corridor_m of a road); run e.g.
#     `cost=displacement methods=[dijkstra,mesh,greedy_arterial_displacement]` to see the
#     navigability-vs-homes-cleared tradeoff (frontage methods land near x=0, the informative contrast).
cost: length
corridor_m: 3.0

shapefile: ???
region_id: phule
assumed_crs: null
max_blocks: 5
# Each inner list is one region seed group (region_builder expands it); a singleton is a
# plain single-block compare. null = no explicit groups (the screen decides; identity ->
# all buildable blocks, max_blocks-limited).
block_ids: null

hydra:
  job:
    chdir: false
