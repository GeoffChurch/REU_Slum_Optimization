defaults:
  - data: dji
  - screen: identity
  - region_builder: identity
  - eval: kcomplexity
  - substrate: chord_diag
  - desire_source: osm
  - metric: depth_density_proxy
  - _self_

# The methods available, then the names to actually run. Overriding the names via
# CLI is clean -- `methods=[clearance,greedy_arterial_buildable]` (topology is slow, minutes/block).
# NOTE: the coverage/frontage baseline `peel` is deliberately absent -- it "wins" coverage trivially
# by paving everything and only clutters the sparse-method comparison (and set the misleading shared
# cost cap the old AUC used). It stays a runnable method (conf/method/peel.yaml) and test fixture;
# just not benchmarked. The registry order below also keys the plot colour palette.
all_methods:
  topology: {_target_: reblock.methods.topology.TopologyMethod}
  greedy_arterial_buildable: {_target_: reblock.methods.arterial.GreedyArterialReblocker, mode: buildable, objective: directness, max_roads: 15, lazy: true, candidate_policy: grow}
  greedy_arterial_repulsion: {_target_: reblock.methods.arterial.GreedyArterialReblocker, mode: buildable, objective: directness, cost: repulsion, max_roads: 15, lazy: true, candidate_policy: grow}
  # aspirational (ideal straight chords, not snapped to frontages) is a DIAGNOSTIC -- it isolates
  # the effect of frontage-snapping, NOT a universal directness ceiling. directness/E measure
  # internal circulation (all-pairs, door-to-door incl. the walk-to-road legs); under that honest
  # metric a frontage-hugging buildable road gives every parcel a short walk leg, so on a compact
  # block buildable tends to match or beat aspirational. The through-road advantage shows on
  # deep/elongated regions, where a straight road shortcuts trips a frontage tree can't.
  # ACCESS objective: greedily maximize 1 - access_burden/base_burden, i.e. optimize sum of squared
  # access depths directly. `GreedyArterialReblocker` has supported `objective: access` since it was
  # written, but every configured variant used `directness`, so it had never been run
  # (notes/2026-08-08-c5-the-access-objective-was-never-wired-up-and-it-wins.md).
  #
  # BOTH costs are configured because which one wins depends on the road width being priced, and
  # neither dominates (notes/2026-08-08-c6-c7-tuning-the-access-objective-and-what-it-draws.md):
  #   repulsion    best at LANE width (2 m): AUC 0.013 vs resistance_lp's 0.080
  #   displacement best at STREET width (7 m): AUC 0.115 vs resistance_lp's 0.137
  # `cost: displacement` optimizes benefit-per-displacement, and displacement is the x-axis these
  # methods are compared on -- legitimate, since it is the real cost and any method may target it,
  # but it is optimizing the axis being reported and that must be stated alongside any result.
  # (The earlier finding that cost=displacement degenerates on sparse fabric was measured against
  # the DIRECTNESS objective and does not transfer: an access gain requires actually fronting
  # parcels, so a gap-hugging road earns nothing.)
  #
  # NOT `lazy` -- unlike the directness variants above. CELF's guarantee needs the objective to be
  # submodular, which holds for directness but NOT for access-burden reduction: measured on 3 blocks
  # x 2 costs, lazy diverged from the exact greedy on 6 of 6 (final burden 0.0733 vs 0.0867 and
  # 0.2600 vs 0.2933 among others), in both directions, and was SLOWER in 4 of 6. So it buys an
  # approximation for no speed.
  greedy_arterial_access_repulsion: {_target_: reblock.methods.arterial.GreedyArterialReblocker, mode: buildable, objective: access, cost: repulsion, max_roads: 15}
  greedy_arterial_access_displacement: {_target_: reblock.methods.arterial.GreedyArterialReblocker, mode: buildable, objective: access, cost: displacement, max_roads: 15}
  greedy_arterial_aspirational: {_target_: reblock.methods.arterial.GreedyArterialReblocker, mode: aspirational, objective: directness}
  greedy_arterial_displacement: {_target_: reblock.methods.arterial.GreedyArterialReblocker, mode: aspirational, objective: directness, cost: displacement, road_width_m: 7.0}
  clearance: {_target_: reblock.methods.clearance.ClearanceReblocker, substrate: "${substrate}", repulsion: 0.0, depth_target: 2, max_roads: 400}
  demand_greedy: {_target_: reblock.methods.demand_greedy.DemandGreedyReblocker, desire_source: "${desire_source}", substrate: "${substrate}", depth_target: 2, max_roads: 400}

  # drainage tree. The gap to demand_greedy is exactly what the desire-line prior is worth.

  # matched permeability with less road than clearance does, so the same loop budget is spent
  # from a cheaper starting point -- the obvious way to improve the flagship.

  # networks close loops within a tight budget where clearance_looped's connectors are the first
  # thing a prefix cuts (5 of 6 blocks have 2-17 cycles in the full network and 0 after
  # displacement-matching, which keeps only 1-33 of 24-166 segments); a 40 m floor excludes exactly
  # the short connectors that score highest on bridges-removed-per-metre and survive truncation.
  # ABLATED (scratchpad/ot/loop_ablation.py, at the example's overrides): min_loop_len_m carries the
  # entire effect and min_bridges_per_m 0.01 -> 0.0 is bit-for-bit inert, so it is NOT changed here.
  # The gain is also settings-dependent -- at the conf defaults (depth_target 1, budget_frac 0.12)
  # the same change is slightly NEGATIVE (0.7370 vs 0.7383); it helps at the example's deeper base.
  resistance_greedy: {_target_: reblock.methods.resistance_greedy.ResistanceGreedyReblocker, substrate: "${substrate}", max_roads: 400, shortlist: 6, loop_radius_m: 0.0, min_loop_len_m: 40.0}
  # Whole road set chosen at once by LP, budgeting DISPLACEMENT (what the lenses score) rather than
  # metres. Decides over paths, so connectivity is structural and the route-(A) rounding obstacle
  # dissolves. chunks is a Frank-Wolfe step count. See conf/method/resistance_lp.yaml.
  # max_displacement 0.20, NOT 0.10: a method's own cap must sit clear of the Lens A budget
  # (matched_displacement, 0.10) or the cap binds before the lens does and the lens compares a
  # terminal network against everyone else's truncated prefix. At 0.10 cycle_native stopped at
  # 0.0998 and read `at_budget: False` on the flagship region -- its headline Lens A number was
  # its own cap, not its performance.
  resistance_lp: {_target_: reblock.methods.resistance_lp.ResistanceLPReblocker, substrate: "${substrate}", max_displacement: 0.20, chunks: 8}
  # Cycle-native: each move is a loop from the street back to the street, so the output is
  # bridgeless by construction and every road can be oriented one-way. See conf/method/cycle_native.yaml.
  cycle_native: {_target_: reblock.methods.cycle_native.CycleNativeReblocker, substrate: "${substrate}", max_displacement: 0.20, shortlist: 8}
  # Flow accumulation rather than drainage: route every trip, count edge traffic, keep the busiest.
  # Sparse, can contain loops, does not reach every parcel -- the properties real footpaths have and
  # a drainage tree cannot. flow_quantile is the hierarchy knob (low = footpath web, high = skeleton).
  flow_paths: {_target_: reblock.methods.flow_paths.FlowPathsReblocker, substrate: "${substrate}", destination: all_pairs, iterations: 3, reinforcement: 0.5, flow_quantile: 0.90}
  flow_paths_noreinforce: {_target_: reblock.methods.flow_paths.FlowPathsReblocker, substrate: "${substrate}", destination: all_pairs, iterations: 1, reinforcement: 0.0, flow_quantile: 0.90}
  clearance_grid: {_target_: reblock.methods.clearance.ClearanceReblocker, substrate: {_target_: reblock.methods.substrates.GridSubstrate, res: 1.5}, repulsion: 0.0, depth_target: 2, max_roads: 400}
  clearance_looped:
    _target_: reblock.methods.loop_closure.LoopClosureRefiner
    base: {_target_: reblock.methods.clearance.ClearanceReblocker, substrate: "${substrate}",
           repulsion: 0.0, depth_target: 1, max_roads: 400}   # depth_target 1 = deeper base (best-of-both)
    budget_frac: 0.12
    min_bridges_per_m: 0.01
    max_loops: 400
    min_loop_len_m: 40.0
    # search_radius_m 45 m: sufficient for block-scale bases with the uniform max_candidates cap,
    # which bounds the expensive per-pair snap volume regardless of mesh density (see _subsample_pairs).
    search_radius_m: 45.0
    max_candidates: 1500
  osm_footpaths: {_target_: reblock.methods.osm_footpaths.OsmFootpathsReblocker, source: "${desire_source}", road_width_m: 7.0}
  euclidean_grid: {_target_: reblock.methods.euclidean_grid.EuclideanGridReblocker, spacing: 60.0, angle: 0.0, min_seg_len: 1.0, street_buffer: 0.5, seek_density: true, adaptive: true}
methods: [topology, clearance, greedy_arterial_buildable]


# Optional: sweep ONE base method over a param's values without hand-writing an all_methods entry
# per value. Expands to `{base}_{param}{value}` methods appended to the run list, e.g.
#   methods=[] 'method_sweep={base: clearance, param: repulsion, values: [-3, 0, 3]}'
method_sweep: null

shapefile: ???
region_id: phule
assumed_crs: null
max_blocks: 5
# Each inner list is one region seed group (region_builder expands it); a singleton is a
# plain single-block compare. null = no explicit groups (the screen decides; identity ->
# all buildable blocks, max_blocks-limited).
block_ids: null

# Screen selection gate (applied to the metric's fine score) + the cheap recall pre-filter
# (keep top-% by proxy before the peel). Calibrated for the default `depth` metric.
proxy_keep_pct: 50.0

hydra:
  job:
    chdir: false
