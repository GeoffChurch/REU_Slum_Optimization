# A Screen (selectable like conf/method, conf/eval). Reads paths from the run's
# Source (a KblockSource) at select() time; the thresholds below are the gates.
_target_: reblock.screen.dense_compact.DenseCompactScreen
# depth_proxy_min gates on sqrt(n*A)/P (building_count * block_area / perimeter, metres) -- a cheap
# closed-form estimate of parcel access depth in rings. It ranks true depth ~5x better than the old
# building-density gate (Spearman 0.76 vs 0.15 on max depth) because deep nesting is frontage-
# starvation, which the perimeter captures. Calibrated on the full Cape Town metro (27,643 blocks
# w/ >=10 buildings): proxy p50=1.53, p80=1.97, p90=2.27, p95=2.60. Keep it PERMISSIVE (the fine
# depth gates below do the real discrimination): >=1.5 keeps ~52% and retains ~74% of the blocks the
# old gate confirmed deep while admitting ~9.5k deep blocks density missed. The known informal
# flagship sits at proxy ~3.75 (full-metro deepest seed at ~15), far above any sane threshold.
depth_proxy_min: 1.5
mean_depth_min: 1.3
# max_depth_min: keep only blocks with at least one parcel this deep (null = off).
# Survivors are always returned ranked by max access-depth, descending.
max_depth_min: null
# k_min: null   # optional extra cheap gate; off by default (density + mean_depth do the work)
