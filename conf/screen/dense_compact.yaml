# A Screen (selectable like conf/method, conf/eval). Reads paths from the run's Source (a
# KblockSource) at select() time; the top-level `metric` + `metric_gate` decide what's flagged
# (pluggable via `metric=depth|depth_density|density_compactness` at the CLI).
_target_: reblock.screen.dense_compact.DenseCompactScreen
metric: ${metric}
gate: ${metric_gate}
proxy_keep_pct: ${proxy_keep_pct}
min_buildings: 10
