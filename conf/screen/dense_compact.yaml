# A Screen (selectable like conf/method, conf/eval). Reads paths from the run's
# Source (a KblockSource) at select() time; the thresholds below are the gates.
_target_: reblock.screen.dense_compact.DenseCompactScreen
# density_min is over the FREE kblock building_count column, which undercounts dense
# informal blocks ~2x vs Open Buildings -- so keep it LOW. Calibrated on the full Cape
# Town metro (40,110 blocks w/ buildings, bld/ha): p50=16, p80=32, p90=46, p95=57. Pass
# rates: >=30 keeps 22%, >=35 keeps 18%, >=50 only 8%. The known informal flagship sits at
# just 35.6 bld/ha, so anything >=~40 starts dropping real informal blocks. Keep this a
# PERMISSIVE cheap prune; the depth gates below do the real informal-settlement discrimination.
density_min: 30.0
mean_depth_min: 1.3
# max_depth_min: keep only blocks with at least one parcel this deep (null = off).
# Survivors are always returned ranked by max access-depth, descending.
max_depth_min: null
# k_min: null   # optional extra cheap gate; off by default (density + mean_depth do the work)
