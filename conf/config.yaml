defaults:
  - data: phule
  - screen: identity
  - region_builder: identity
  - method: dijkstra
  - eval: kcomplexity
  - _self_

# Top-level scalars are the interpolation sources the data/method config
# groups reference (${shapefile}, ${alpha}, ...) -- overriding them at the
# CLI (e.g. `shapefile=...`) flows into whichever source/method is selected
# without needing group-qualified overrides like `data.path=...`.
shapefile: ???
region_id: phule
alpha: 2.0
seed: 0
assumed_crs: null
max_blocks: 1

# Render emitter (reblock.emit): opt-in, writes {block}_before.png +
# {block}_{proposal}_after.png into the Hydra run dir. F1 supports png/separate.
render:
  enabled: false
  format: png
  layout: separate

# City flagged-map emitter (reblock.emit.flagged_map): opt-in; draws all metro
# blocks light with the screen's flagged blocks highlighted, into the run dir.
flagged_map:
  enabled: false

# Region-builder map emitter (reblock.emit.region_map): opt-in; draws every candidate
# block light with each region's member blocks filled by region color, into the run dir.
region_map:
  enabled: false

# Region seed groups (kblock sources only): a LIST OF LISTS of block ids -- each inner
# list is one region's seed group (a singleton = single-block reblocking), which the
# region_builder expands into the region actually reblocked. null => every block a
# singleton (the classic per-block behavior). NOT the Source's flat load filter.
block_ids: null

hydra:
  job:
    chdir: false   # keep CWD at the invocation dir so a source's relative fixture paths resolve
