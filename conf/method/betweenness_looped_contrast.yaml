# The loop-closing refiner around betweenness_tree_contrast. The loop settings are the region-scale
# values the frontier study measured (conf/example/explore.yaml's clearance_looped tuning), not
# conf/method/loop_closure.yaml's block-scale 0.12 / 45. cycle_native_betweenness_contrast beats it
# on both lenses on 36 large blocks (Lens A +0.041, Lens B -0.005): it stays on the frontier for
# road, 6.7 km against ~9 km (full networks, median).
# Gives up road and runtime against the tree: 6.7 km against 5.2 km, and minutes where clearance
# takes seconds (Bloekombos: ~200 s at 40 workers, prior pass included).
_target_: reblock.methods.loop_closure.LoopClosureRefiner
base:
  _target_: reblock.methods.demand_greedy.DemandGreedyReblocker
  desire_source: ${betweenness.contrast}
  substrate: ${substrate}
  buffer_m: 3.0
  eps: 0.1
  gamma: 1.0
  depth_target: 2
  max_roads: 400
  road_width_m: 7.0
budget_frac: 0.30
min_bridges_per_m: 0.01
max_loops: 400
min_loop_len_m: 40.0
search_radius_m: 60.0
snap_lam: 2.0
max_candidates: 1500
road_width_m: 7.0
