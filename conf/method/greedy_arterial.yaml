_target_: reblock.methods.arterial.GreedyArterialReblocker
realizer:
  _target_: reblock.methods.arterial.SnapToBoundary
  lam: 2.0
objective:
  _target_: reblock.methods.arterial.Directness
cost:
  _target_: reblock.methods.arterial.Length
engine:
  _target_: reblock.methods.arterial.ExactEngine
road_width_m: 7.0
# Greedy budget + candidate-generation knobs (first-class so they're plain `method.<k>=` overrides).
# Cost is ~fixed per road (~1 step scores anchors^2 + anchors*top_k candidates), so max_roads is
# a near-linear runtime dial -- lower it to keep arterial tractable on a big region.
max_roads: 15
anchors: {_target_: reblock.methods.arterial.Uncapped, n: 32}
max_displacement: 0.20
top_k: 8
workers: 16
