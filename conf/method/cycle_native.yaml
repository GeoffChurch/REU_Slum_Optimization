# The CYCLE is the primitive, not the spur. Every other method adds a path from an unserved parcel
# back to the network, which makes its output a tree with (at best) loops bolted on. Here each move
# is a path OUT to a parcel plus a second path BACK that avoids the outbound edges -- so the return
# is a genuine alternate route, and the network is bridgeless by construction.
#
# Bridgeless matters beyond redundancy: by Robbins' theorem a connected graph has a strongly
# connected orientation iff it is bridgeless, so every road this emits can be made one-way without a
# repair pass. Measured: bridge fraction exactly 0.000, against 0.18-0.35 for every other method.
#
# See reblock.methods.cycle_native.CycleNativeReblocker.
_target_: reblock.methods.cycle_native.CycleNativeReblocker
substrate: ${substrate}
# Must sit clear of the Lens A budget (matched_displacement, 0.10) or this cap
# binds before the lens does -- see conf/compare_config.yaml.
max_displacement: 0.20
# max_cycles is left at the dataclass default (400) DELIBERATELY: it is a safety valve, and
# `max_displacement` above is meant to be what stops this method. Setting it here would invite
# tuning it, which is how the old hardcoded `range(60)` came to end the reported curve at
# 6.9-16.0% displacement in every settlement region while the config said 0.20.
shortlist: 8
