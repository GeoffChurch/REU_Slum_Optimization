# @package _global_
# The TEST fixture variant: `explore`'s pipeline on a small block.
#
# It exists because a parity test has two jobs that want different data. "The baker is correct"
# -- curves match the solver -- needs a real block exercised end to end, and any real block will
# do. "The shipped bundle is fresh" needs the actual 6,619-parcel artifact. Bundling both into one
# test meant re-deriving the shipped artifact to check the baker, and MEASURED on 2026-09-21 that
# cost 2,882 s of a 2,895 s test: `tests/conftest.py` points `REBLOCK_CACHE_DIR` at a fresh temp
# directory every session (deliberately -- a hermetic suite must never read a developer's warm
# cache), so every run re-proposed every method from cold.
#
# So the parity tests run HERE, and the shipped bundle keeps its cheap freshness checks -- block
# id, method set, and per-method segment counts against the example's own run.log.
#
# Same block as `method_comparison` (263 parcels), and NOT that variant itself: it runs `topology`
# at 377 s and `resistance_lp`, neither of which `explore` has, and topology alone would cost more
# than everything this fixture does.
#
# `explore`'s methods less the two that cost: `greedy_arterial_access_displacement` and
# `cycle_native_betweenness_contrast`. The parity test checks the curve math (street-first prefixes
# and their permeability), which is the same whichever method drew the roads, and the three left
# give it varied road sets (92, 40 and 9 roads, and the OSM footpaths) in about 3 s of proposing.
# The test re-proposes from a cold cache, and on this block the arterial cost ~495 s of CPU through
# its 16-worker pool and the betweenness field 54 s through its own. Both proposal paths are
# checked in CI, where this test skips: the arterial's by tests/methods/test_arterial.py (shortlist
# against the exact engine, the pinned 1808 WKT), and every configured method's by the width test.
defaults:
  - override /metric: depth_density
  - override /screen: identity
  - override /region_builder: identity

example:
  # Its OWN slug, not `method-comparison`'s, even though it borrows that block. `_snapshot_path`
  # resolves `examples/<slug>/desire_lines_<block>.geojson`, so sharing a slug would make a stray
  # `gen_example explore_small` overwrite a shipped example's directory.
  slug: explore-small
  formula: "depth × density — the test fixture"
  blurb: >-
    `explore`'s pipeline on a 263-parcel block. A fixture for the bundle parity tests, not a
    published example: it is never baked to the site and nothing links it.

block_ids: [["ZAF.9.3.1_1_40972"]]

# `explore.yaml`'s list and order less those two (above).
methods: [clearance_looped, euclidean_grid, cycle_native]
max_blocks: 1
