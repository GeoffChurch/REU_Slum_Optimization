# @package _global_
# One example variant, entirely in config. `scripts/gen_example.py` is the single entry point for
# every example; a variant differs ONLY in this file -- which region it grades (a metric-grown one
# or a pinned block list) and which methods it runs.
defaults:
  - override /metric: depth_density
  - override /screen: dense_compact
  - override /region_builder: dense_cluster

example:
  slug: multiblock_depth_density
  formula: "depth × density  —  deep AND crowded"
  blurb: >-
    Deep and crowded at once — the metric that isolates the genuine informal settlements and fades
    the deep-but-sparse blocks.

# null -> grow a region with the screen + region_builder above. A list pins exact blocks instead.
block_ids: null

  # greedy_arterial_access_displacement is DELIBERATELY ABSENT from the multiblock variants and
  # present only in method_comparison. Measured 2026-08-10: this variant takes 1,115 s without it
  # and had not finished after 11.6 h WITH it, on an 11,006-parcel region -- the objective is global
  # (a full BFS peel over every parcel) while each candidate is local, and capping max_anchors does
  # not rescue it. It is affordable and evidenced at BLOCK scale, which is what method_comparison
  # scores. See backlog, "Making the access objective affordable at region scale".
methods: [clearance_looped, euclidean_grid, resistance_lp, cycle_native]
max_blocks: 1
region_builder: {max_buildings: 3000}
all_methods:
  clearance_looped:
    base: {depth_target: 3, max_roads: 3000}
    budget_frac: 0.30
    search_radius_m: 60
  euclidean_grid: {spacing: 250}   # coarser grid -> budget in the pack
