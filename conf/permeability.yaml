# Permeability metric params + the two universal calibration thresholds. D was set 2026-07-22 from
# scripts/calibrate_permeability.py's frontiers (Task 3 checkpoint, owner sign-off): methods
# converge at low displacement (mostly <20%), so D=10% is the matched level where >=2 methods are
# still building.
#
# g_walk lowered 1.0 -> 0.1 and the footpath edge switched from a plain g_walk/dist model to the
# r0-corridor open-corridor-fraction model (r0_frac below) 2026-07-23: scratchpad experiments
# (conductance_variants.py / combination_experiment.py / r0_sweep.py) on
# multiblock_density_compactness found this combination massively improves method discrimination
# (D=10% method-spread ~0.9pts -> ~11.8pts) -- see reblock.permeability's module docstring for
# the formula.
g_walk: 0.1
# Conductance per METRE of usable road width, per unit distance. Replaced g_road (20.0) + the
# global corridor_m (3.0) 2026-07-31: width is carried per road now, so there is no standard road
# for a single g_road to describe. 8.0 reproduces the old numbers exactly -- a default 6 m two-way
# road gives each direction (6 - road_margin_m)/2 = 2.5 m of usable width, and 8.0 * 2.5 = 20.0.
g_road_per_m: 8.0
g_street: 20.0
# Irreducible corridor margin (verge, drainage, wall clearance), paid once per road however many
# lanes it carries. Makes conductance AFFINE in width, and makes a one-way street wider than half a
# two-way one: they match per-direction at W_one = (W_two + margin)/2 = 3.5 m, not 3.0 m.
road_margin_m: 1.0
r0_frac: 0.55   # r0 = r0_frac * median(building nearest-neighbour distance) -- adaptive corridor
                # half-width; 0.55 lands r0~3m on multiblock_density_compactness (median NN~5.2m).
# Lens A -- matched displacement %: truncate every method to its first prefix at/after this
# displacement fraction, then compare permeability reached at that equal home-cost.
matched_displacement: 0.10   # 10% of homes (Lens A)
# Lens B -- matched permeability: truncate every method to its first prefix reaching this
# permeability level, then compare displacement cost to get there (a method whose full network
# never reaches it reads as "unreached"). RECALIBRATED 2026-07-23 for the r0-corridor metric above
# (owner sign-off): under the new conductance, the old P*=0.40 is reached almost immediately by
# every capable method (~2-5% displacement on multiblock_density_compactness, a ~2pt cost spread --
# no longer discriminating). P*=0.60 restores the original threshold's character: reached by 16/21
# (method,region) pairs (scripts/calibrate_permeability.py, full probe across all 7 example
# regions) -- the SAME coverage ratio the old 0.40 was calibrated to -- but now at a meaningfully
# non-trivial, well-spread cost for the methods that do reach it (multiblock_density_compactness:
# clearance_looped 5.9%, osm_footpaths 8.9%, euclidean_grid 9.9% displacement, a ~4pt spread), and
# still honestly missed by the sparse/weak ones (greedy_arterial_repulsion; both weak methods on
# density_compactness/nairobi).
matched_permeability: 0.60   # permeability >= 0.60 (Lens B)
